services:
  db:
    build: ./db
    environment:
      POSTGRES_DB: transit_tracker
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit -d transit_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://transit:transit_dev@db:5432/transit_tracker
    volumes:
      - ./backend:/app
      - ./frontend/public/geojson:/app/geojson
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  transit_pgdata:
  ml_models:
